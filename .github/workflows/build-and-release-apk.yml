name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'GITHUB_APK_GUIDE.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          OUTPUT_APK="app/build/outputs/apk/debug/Evenza-Counter-debug.apk"
          if [ "$APK_PATH" != "$OUTPUT_APK" ]; then
            cp "$APK_PATH" "$OUTPUT_APK"
          fi
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          DATE_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evenza-Counter-debug-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Android APK Build"
          body: |
            ### 📱 Evenza Counter - Latest APK Release

            An automated Android build was triggered by a code commit.

            - **File**: `Evenza-Counter-debug.apk`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Date**: `${{ steps.prepare_apk.outputs.date_tag }}`

            #### 📥 How to Install:
            1. Download the `Evenza-Counter-debug.apk` file attached below directly onto your Android phone.
            2. Open the downloaded `.apk` file and tap **Install**.
            3. If prompted, allow installations from your browser/file manager.
          draft: false
          prerelease: false
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
