name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'GITHUB_APK_GUIDE.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset & Release Tag
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi

          # Extract version from app/build.gradle.kts
          APP_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0"
          fi

          OUTPUT_APK="app/build/outputs/apk/debug/Evenza-v${APP_VERSION}-debug.apk"
          cp "$APK_PATH" "$OUTPUT_APK"
          
          # Tag format requested: Evenza and its version number (e.g. Evenza-v1.0)
          TAG_NAME="Evenza-v${APP_VERSION}"
          RELEASE_TITLE="Evenza v${APP_VERSION}"

          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evenza-debug-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: ${{ steps.prepare_apk.outputs.release_title }}
          body: |
            ### 📱 Evenza v${{ steps.prepare_apk.outputs.app_version }} - APK Release

            Automated Android release build for Evenza.

            - **Release**: `${{ steps.prepare_apk.outputs.release_title }}`
            - **Tag**: `${{ steps.prepare_apk.outputs.tag_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### 📥 How to Install:
            1. Download the `Evenza-v${{ steps.prepare_apk.outputs.app_version }}-debug.apk` file attached below directly onto your Android phone.
            2. Open the downloaded `.apk` file and tap **Install**.
            3. If prompted, allow installations from your browser/file manager.
          draft: false
          prerelease: false
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
